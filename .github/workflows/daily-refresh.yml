# NBR KPI dashboard: refreshes the numbers 4 times a day and on demand ("Run workflow" on the Actions tab).
# GitHub schedules use UTC. EST (until Mar 8, 2027) = UTC-5. Each run starts ~45 minutes early because
# GitHub often starts scheduled runs late. After Mar 8 (EDT) every run lands one hour later in ET:
# move each cron one hour earlier then (see README).
name: Daily refresh

on:
  schedule:
    - cron: "15 10 * * *"   # 5:15am ET -> data by 6am ET. Morning run: "yesterday" moves to the day that just ended
    - cron: "15 16 * * *"   # 11:15am ET -> data by noon
    - cron: "15 22 * * *"   # 5:15pm ET -> data by 6pm
    - cron: "15 4 * * *"    # 11:15pm ET -> data by midnight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Read-only NBR GHL key, stored as the repo secret GHL_TOKEN. Never printed. Until it exists, the run
      # keeps the last API numbers (the page says so) and only rolls the dates forward.
      - name: Pull fresh numbers from GHL (read-only)
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        # If the pull stops, wait 3 minutes and try once more. If it stops again the run fails (GitHub emails
        # the repo owner) and nothing below runs, so the last good numbers stay live.
        run: python3 -I scripts/pull.py || { echo "First try stopped; trying again in 3 minutes."; sleep 180; python3 -I scripts/pull.py; }

      # If anything private slipped in, the run stops here and nothing is published.
      - name: Privacy scan
        run: python3 -I scripts/privacy_scan.py index.html data.json report.txt config.json ui.json README.md scripts/pull.py scripts/ui_update.py

      - name: Publish
        run: |
          git config user.name "nbr-kpi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json report.txt
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          python3 -I scripts/privacy_scan.py
          git commit -q -m "Numbers $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase -X theirs
          git push
